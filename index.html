<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>긍정의 한마디</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* 밝은 회색 그라데이션 */
      background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 50%, #e2e8f0 100%);
      color: #1e293b;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* 완성도 높은 모던 미니멀 카드 */
    .message-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 3.5rem 4rem;
      text-align: center;
      box-shadow: 
        0 20px 45px -10px rgba(15, 23, 42, 0.08),
        0 8px 16px -6px rgba(15, 23, 42, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 상단 포인트 뱃지 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    /* 메시지 텍스트 (40px, 부드러운 전환) */
    .message-area {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.2rem;
      width: 100%;
    }

    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.35;
      color: #1e293b;
      user-select: none;
      word-break: keep-all;
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 1;
      transform: translateY(0);
    }

    h1.fade-out {
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
    }

    h1.fade-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 버튼 컨테이너 (파티클 기준점) */
    .btn-wrapper {
      position: relative;
      display: inline-block;
    }

    /* 문장마다 색상이 변경되는 버튼 */
    .next-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      padding: 14px 34px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.38);
      transition: background 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.15s ease;
      user-select: none;
      font-family: inherit;
      position: relative;
      overflow: hidden;
      outline: none;
    }

    .next-btn:hover {
      transform: translateY(-2px);
    }

    .next-btn:active {
      transform: scale(0.94);
    }

    /* 클릭 시 물결 리플(Ripple) 효과 */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* 클릭 시 터져나오는 스파클 파티클 효과 */
    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 9999;
      animation: popParticle 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popParticle {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }

    /* 모바일 반응형 */
    @media (max-width: 640px) {
      .message-card {
        padding: 2.5rem 1.75rem;
        border-radius: 20px;
      }

      .message-area {
        min-height: 90px;
      }

      h1 {
        font-size: 30px;
      }

      .btn-wrapper, .next-btn {
        width: 100%;
      }

      .next-btn {
        font-size: 16px;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <main class="message-card">
    <div class="badge">
      <span class="badge-dot" id="badge-dot"></span>
      <span id="step-indicator">1 / 4</span>
    </div>

    <div class="message-area">
      <h1 id="cheer-message">오늘도 힘내세요!</h1>
    </div>

    <div class="btn-wrapper">
      <button id="next-btn" class="next-btn" type="button">
        다음 문장 보기
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </main>

  <script>
    // 4가지 문장과 각 문장에 어울리는 테마 색상 설정
    const themes = [
      {
        message: "오늘도 힘내세요!",
        color: "#2563eb",         // 로열 블루
        shadow: "rgba(37, 99, 235, 0.38)",
        particleColors: ["#3b82f6", "#60a5fa", "#93c5fd", "#2563eb", "#dbeafe"]
      },
      {
        message: "당신의 하루를 응원합니다!",
        color: "#059669",         // 싱그러운 에메랄드 그린
        shadow: "rgba(5, 150, 105, 0.38)",
        particleColors: ["#10b981", "#34d399", "#6ee7b7", "#059669", "#d1fae5"]
      },
      {
        message: "작은 발걸음도 멋진 시작이에요!",
        color: "#ea580c",         // 활기찬 웜 오렌지
        shadow: "rgba(234, 88, 12, 0.38)",
        particleColors: ["#f97316", "#fb923c", "#fdba74", "#ea580c", "#ffedd5"]
      },
      {
        message: "오늘도 빛나는 하루가 될 거예요!",
        color: "#7c3aed",         // 화사하고 신비로운 바이올렛
        shadow: "rgba(124, 58, 237, 0.38)",
        particleColors: ["#8b5cf6", "#a78bfa", "#c4b5fd", "#7c3aed", "#ede9fe"]
      }
    ];

    let currentIndex = 0;
    const messageEl = document.getElementById('cheer-message');
    const nextBtn = document.getElementById('next-btn');
    const stepIndicator = document.getElementById('step-indicator');
    const badgeDot = document.getElementById('badge-dot');

    // 초기 테마 스타일 적용
    function applyTheme(theme) {
      nextBtn.style.backgroundColor = theme.color;
      nextBtn.style.boxShadow = `0 8px 22px ${theme.shadow}`;
      badgeDot.style.backgroundColor = theme.color;
      badgeDot.style.boxShadow = `0 0 10px ${theme.color}`;
    }

    // 클릭 시 터지는 스파클 파티클 효과
    function createParticles(x, y, colors) {
      const particleCount = 24; // 생성할 파티클 개수

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // 크기 랜덤
        const size = Math.floor(Math.random() * 8) + 5;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;

        // 색상 랜덤 배정
        const color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.backgroundColor = color;

        // 발사 각도 및 거리 (원형으로 사방으로 폭죽처럼 확산)
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 80 + 40;
        const dx = `${Math.cos(angle) * distance}px`;
        const dy = `${Math.sin(angle) * distance}px`;

        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--dy', dy);
        particle.style.left = `${x - size / 2}px`;
        particle.style.top = `${y - size / 2}px`;

        document.body.appendChild(particle);

        // 애니메이션 끝나면 DOM에서 제거
        setTimeout(() => {
          particle.remove();
        }, 750);
      }
    }

    // 버튼 클릭 이벤트
    nextBtn.addEventListener('click', (e) => {
      // 1. 버튼 내부 물결(Ripple) 효과
      const rect = nextBtn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
      ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
      nextBtn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // 2. 클릭 지점에서 팡 터지는 파티클 효과
      const currentTheme = themes[currentIndex];
      createParticles(e.clientX, e.clientY, currentTheme.particleColors);

      // 3. 다음 메시지 및 테마로 순환
      currentIndex = (currentIndex + 1) % themes.length;
      const nextTheme = themes[currentIndex];

      // 버튼 색상 부드럽게 전환
      applyTheme(nextTheme);

      // 4. 문장 페이드 아웃/인 전환
      messageEl.classList.add('fade-out');

      setTimeout(() => {
        messageEl.textContent = nextTheme.message;
        stepIndicator.textContent = `${currentIndex + 1} / ${themes.length}`;
        messageEl.classList.remove('fade-out');
        messageEl.classList.add('fade-in');

        setTimeout(() => {
          messageEl.classList.remove('fade-in');
        }, 250);
      }, 200);
    });

    // 시작 시 첫 번째 테마 적용
    applyTheme(themes[0]);
  </script>
</body>
</html>
